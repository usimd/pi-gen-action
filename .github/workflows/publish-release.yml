name: Publish release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Prerelease version to build (for example v2.0.0-rc.1)
        required: true
        type: string
  release:
    types: 
      - released

jobs:
  publish-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Validate prerelease version
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
          fetch-depth: 0 # fetch full history for Git tests

      - uses: actions/setup-node@v7
        with:
            node-version: 26
            cache: npm

      - name: Test and create dist files
        run: npm ci && npm run all

      - name: Bundle supported Debian locales
        run: npm run update-locales

      - name: Push dist to new tag
        uses: teunmooij/github-versioned-release@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          version: ${{ github.event.release.tag_name || inputs.version }}
          include: |-
            dist/licenses.txt
            dist/index.js
            dist/package.json
            dist/supported-locales.json
            README.md
            LICENSE
            action.yml

      - name: Create prerelease
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: gh release create "$VERSION" --verify-tag --prerelease --title "$VERSION" --generate-notes
